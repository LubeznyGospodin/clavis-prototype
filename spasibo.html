<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Спасибо · CLAVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=23">
</head>
<body>
<div data-header></div>
<main id="main"><section class="page-hero"><div class="wrap" style="text-align:center;max-width:760px">
<div class="eyebrow">Готово</div><h1 id="t" style="margin-bottom:18px">Спасибо за заявку</h1><p class="lead" id="l" style="margin:0 auto 22px">Менеджер свяжется с вами в течение рабочего дня.</p>
<p class="card" id="subj" style="display:none;text-align:left"></p>
<div class="btns" style="justify-content:center;margin-top:26px"><a class="btn" href="katalog.html">В каталог</a><a class="btn btn--ghost" href="recepty.html">Рецепты</a></div></div></section></main>
<div data-footer></div>
<script src="js/data.js?v=23"></script>
<script src="js/site.js?v=23"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let last = null; try { last = JSON.parse(sessionStorage.getItem('clavis_last')); } catch {}
  if (!last) return;
  if (last.kind === 'order') { $('#t').textContent = 'Спасибо за заказ'; $('#l').textContent = 'Чек придёт на почту, статус заказа пришлём письмом.'; }
  $('#subj').style.display = 'block';
  $('#subj').innerHTML = `<span class="eyebrow">Тема письма менеджеру</span><br><b>${esc(last.subject)}</b><br><span class="note">В прототипе заявка сохраняется только в этом браузере. На рабочем сайте она уйдёт на почту и в Битрикс24.</span>`;
});
</script>
</body>
</html>
