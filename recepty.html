<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Рецепты · CLAVIS</title>
<meta name="description" content="Коктейли, моктейли, лимонады и горячие напитки на основах CLAVIS. Ингредиенты в миллилитрах, бокал и метод.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div data-header></div>
<main id="main">
  <section class="page-hero" style="padding-bottom:28px"><div class="wrap"><div class="crumbs"><a href="index.html">Главная</a> / Рецепты</div><h1>Рецепты</h1><p class="lead">Основа, лёд и одна-две жидкости. Большинство напитков готовятся за минуту без шейкера.</p></div></section>
  <section class="section" style="padding-top:0"><div class="wrap"><div class="filters" id="filters"></div><div class="grid grid--3" id="grid"></div></div></section>
</main>
<div data-footer></div>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const st = { kind: param('kind') || '', alc: '', where: '' };
  const opts = { kind: [['', 'Все'], ...Object.entries(KINDS)], alc: [['', 'Все'], ['no', 'Без алкоголя'], ['yes', 'С алкоголем']], where: [['', 'Везде'], ['bar', 'За стойкой'], ['home', 'Дома']] };
  const labels = { kind: 'Тип напитка', alc: 'Алкоголь', where: 'Где готовим' };
  function render() {
    $('#filters').innerHTML = Object.keys(opts).map((k) => `<div class="filter-row"><span>${labels[k]}</span>${opts[k].map(([v, t]) => `<button class="chip${st[k] === v ? ' is-on' : ''}" data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div>`).join('');
    const list = RECIPES.filter((r) => (!st.kind || r.kind === st.kind) && (!st.alc || (st.alc === 'yes') === r.alcohol) && (!st.where || r.where === st.where));
    $('#grid').innerHTML = list.length ? list.map(recipeCard).join('') : '<div class="empty" style="grid-column:1/-1">Под эти фильтры рецептов нет.</div>';
  }
  $('#filters').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) { st[c.dataset.k] = c.dataset.v; render(); } });
  render();
});
</script>
</body>
</html>
